# dsh-voice-assistant bundle patch
# install: dsh plugin --profile <name> add link:<abs path to plugin/>
#
# 这里刻意不写 root：插件会依次使用 config.root、环境变量 DSH_VOICE_ROOT、
# 自身所在仓库（plugin/ 的上一级），因此同一份包在 Linux/Windows 都能用。
# 解析后用 python -c 'import yaml; yaml.safe_load(open("plugin/cordis.patch.yml"))' 校验。
- insert:
    - id: voice-assistant
      name: dsh-voice-assistant
      config:
        services: [tts, autoread, bridge, loop]
        ttsEngine: edge
        ttsVoice: zh-CN-XiaoxiaoNeural
        kokoroVoice: zf_xiaoyi
        wakeWords: '小艺,小艺小艺,你好小艺,小艺助手'
